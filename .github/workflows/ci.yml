name: CI

# Scope: this workflow is the `develop` -> `master` gate and nothing else.
#
# `pull_request.branches` filters the BASE branch only - GitHub has no source-branch filter in
# `on:` - so every job additionally carries an `if:` that pins the source branch to `develop`.
#
# Two consequences, both deliberate and agreed with the repository owner:
#
# 1. A pull request into `master` that does NOT come from `develop` skips every job, and GitHub
#    records a run whose jobs were all skipped as SUCCESSFUL - a skipped job also satisfies a
#    required status check. Such a pull request is therefore reported green without a single test
#    having run. No unconditional gate job is added to turn that into a red result.
#    The one such path this repository actually uses is the `hotfix/* -> master` emergency
#    release described in CONTRIBUTING.md. A hotfix pull request goes green untested, and the
#    release it triggers publishes zips and images that no test in this repository has seen.
#    Run the full suite locally - or start this workflow by hand on the hotfix branch - before
#    merging one. That is a deliberate trade for Actions minutes, not an oversight.
# 2. Pushes to `develop`, pushes to feature branches and pull requests INTO `develop` - including
#    Dependabot's - no longer start CI at all. Run this workflow manually from the Actions tab
#    (`workflow_dispatch`) when a branch needs checking before it reaches `develop`.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Forces English CLI output. `dotnet list package --vulnerable` is localised, and the
  # grep below would silently never match on a runner with a different locale.
  DOTNET_CLI_UI_LANGUAGE: en-US

jobs:
  build-test:
    name: build-test
    # `github.head_ref` is empty for anything that is not a `pull_request`, so the manual run has
    # to be allowed explicitly or `workflow_dispatch` would always skip.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Fails here rather than halfway through a release: VERSION.md is what the release
      # pipeline reads, and a typo in it is only discoverable after the merge otherwise.
      - name: Validate VERSION.md
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r' < VERSION.md \
            | grep -oEm1 '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            | head -1 | sed 's/^v//') || true

          if [[ -z "${VERSION:-}" ]]; then
            echo "VERSION.md has no version on a line of its own. Expected e.g. 1.2.3" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi

          {
            echo "### Version"
            echo ""
            echo "VERSION.md declares \`${VERSION}\`; tag \`v${VERSION}\` exists: \`${EXISTS}\`."
            echo ""
            if [[ "$EXISTS" == "true" ]]; then
              echo "Merging this into master will **not** publish a release."
              echo "Bump VERSION.md if it should."
            else
              echo "Merging this into master will publish **v${VERSION}**."
            fi
            if ! grep -qF "[${VERSION}]" CHANGELOG.md 2>/dev/null; then
              echo ""
              echo "CHANGELOG.md has no \`[${VERSION}]\` section yet."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # `setup-dotnet`'s own `cache: true` needs a packages.lock.json, which this repository does
      # not use; the global package folder is cached directly instead, keyed on the project files
      # so a dependency bump invalidates it.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # No `--logger trx`: the .trx file used to be uploaded as an artifact, and with that upload
      # gone nothing would ever read it. A failing test prints to the run log either way.
      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format TargetApiSimulator.sln --verify-no-changes --no-restore --severity warn

      - name: Vulnerable packages
        run: |
          set -uo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "Vulnerable packages found." >&2
            exit 1
          fi

  docker:
    name: docker
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'develop'
    # Building the image repeats `dotnet restore` + `publish` inside the Dockerfile, so there is
    # nothing to learn from it once the unit tests are already red.
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # `load: true` puts the image into the local daemon, which is what the smoke test below
      # runs.
      #
      # About the layer cache: GitHub scopes a cache to the ref that wrote it, and a run may read
      # only its own ref plus the base and default branches. This workflow runs on `pull_request`
      # and `workflow_dispatch` only, and nothing on `master` writes a buildx cache, so a hit
      # comes from an earlier run on THIS pull request - a re-run, or a later push to the same
      # branch - and never from another pull request. `mode=max` keeps the SDK stage's restore
      # and publish layers, which is the whole saving; `mode=min` would export the final stage
      # only and leave nothing worth restoring. Kept as is: within a pull request it earns its
      # keep, and GitHub evicts it on its own (LRU at the 10 GB repository limit, plus a 7-day
      # unused-entry policy).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --rm --name tas -p 5000:8080 tas:ci
          for _ in $(seq 1 30); do
            if curl -sf -X POST http://localhost:5000/api/target \
                 -H 'Content-Type: application/json' -d '{"a":1}' >/dev/null; then
              break
            fi
            sleep 1
          done

          # The same script that ships inside every release zip. Running it here means the
          # shipped verification tool cannot rot unnoticed, and it covers the request body
          # limit, which TestServer does not enforce and unit tests therefore cannot reach.
          bash scripts/smoke-test.sh http://localhost:5000

          docker logs tas
          docker rm -f tas

  # Kept, not removed: this is the only required status check named by the rulesets in
  # .github/rulesets, so dropping it would leave both protection rules pointing at a check that
  # can never report.
  ci-required:
    name: ci-required
    # `always()` is what makes this report a failure when build-test fails. The branch guard has
    # to be repeated here, or this job would be the one thing still running - and failing on the
    # `skipped` results of the other two - on a pull request that is not from `develop`.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.head_ref == 'develop') }}
    needs: [build-test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more CI jobs failed." >&2
          exit 1
