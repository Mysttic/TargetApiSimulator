name: Release

# Driven by VERSION.md, not by a hand-pushed tag. A merge into master that changes the version
# publishes it; a merge that does not leaves the existing tag alone and stops early.
#
# The tag is created inside the release job rather than in a separate workflow on purpose: a tag
# pushed with GITHUB_TOKEN does not trigger further workflow runs, so splitting this in two would
# create the tag and then silently do nothing.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run build + unit tests before publishing (off by default: the develop -> master pull request already ran them on this tree)"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en-US
  IMAGE_GHCR: ghcr.io/mysttic/targetapisimulator
  IMAGE_DOCKERHUB: docker.io/mysttic/targetapisimulator

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
      proceed: ${{ steps.v.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION.md
        id: v
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f VERSION.md ]]; then
            echo "VERSION.md is missing." >&2
            exit 1
          fi

          # The version must be alone on its own line. Prose in the file cannot match.
          VERSION=$(tr -d '\r' < VERSION.md \
            | grep -oEm1 '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            | head -1 | sed 's/^v//') || true

          if [[ -z "${VERSION:-}" ]]; then
            echo "No version found in VERSION.md. Expected a line such as: 1.2.3" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi

          if [[ "${{ github.event_name }}" == "push" && "$EXISTS" == "false" ]]; then
            SHOULD_RELEASE=true
          else
            SHOULD_RELEASE=false
          fi

          if [[ "$SHOULD_RELEASE" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PROCEED=true
          else
            PROCEED=false
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "proceed=${PROCEED}" >> "$GITHUB_OUTPUT"

          {
            echo "### Release check"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| VERSION.md | \`${VERSION}\` |"
            echo "| Tag \`v${VERSION}\` already exists | \`${EXISTS}\` |"
            echo "| Will publish | \`${SHOULD_RELEASE}\` |"
            echo ""
            if [[ "$EXISTS" == "true" && "${{ github.event_name }}" == "push" ]]; then
              echo "Nothing to do: bump the version in VERSION.md to publish a new release."
            fi
            if ! grep -qF "[${VERSION}]" CHANGELOG.md 2>/dev/null; then
              echo "> CHANGELOG.md has no \`[${VERSION}]\` section. The release notes will be"
              echo "> generated from commits only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Off by default. CI already built and tested this exact tree on the develop -> master pull
  # request, and the master ruleset requires that check to be up to date with master before the
  # merge, so a third run of the same tests buys very little. It stays here, one checkbox away,
  # for a release cut by hand or from a commit that never went through a pull request.
  verify:
    name: verify
    needs: version
    if: ${{ needs.version.outputs.proceed == 'true' && inputs.run_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Shares its key with ci.yml's build-test: same solution, same restore.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build

  # The headline artifact: one executable per platform that runs on a machine with no .NET
  # installed. Nothing to unpack beyond the zip, nothing to install.
  publish-standalone:
    name: publish (${{ matrix.rid }})
    needs: [version, verify]
    # `!cancelled()` is required: `verify` is skipped on a normal release, and a skipped `needs`
    # would otherwise skip this job too. A `verify` that ran and FAILED still blocks publishing.
    if: ${{ !cancelled() && needs.version.outputs.proceed == 'true' && needs.verify.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Keyed per RID: a self-contained publish pulls a different runtime package set for each.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.rid }}-
            ${{ runner.os }}-nuget-

      - name: Publish ${{ matrix.rid }}
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet publish src/TargetApiSimulator/TargetApiSimulator.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -p:Version="$VERSION" \
            -p:InformationalVersion="$VERSION+$GITHUB_SHA" \
            --output "out/$RID"

          LAUNCHER=TargetApiSimulator
          [[ "$RID" == win-* ]] && LAUNCHER=TargetApiSimulator.exe

          if [[ ! -f "out/$RID/$LAUNCHER" ]]; then
            echo "No launcher was produced for $RID; the zip would not be runnable." >&2
            ls -la "out/$RID" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          NAME="TargetApiSimulator-$VERSION-$RID"

          # IIS hosting leftovers from the Web SDK. Nothing here is hosted in IIS, and they only
          # make the download look like it needs assembling.
          rm -f "out/$RID/web.config" \
                "out/$RID/aspnetcorev2_inprocess.dll" \
                "out/$RID/TargetApiSimulator.staticwebassets.endpoints.json"

          [[ "$RID" == win-* ]] || chmod +x "out/$RID/TargetApiSimulator"

          # Shipped alongside the binary so anyone can confirm a download actually works.
          cp scripts/smoke-test.ps1 scripts/smoke-test.sh "out/$RID/"
          chmod +x "out/$RID/smoke-test.sh"

          mkdir -p dist
          ( cd "out/$RID" && zip -r "$GITHUB_WORKSPACE/dist/$NAME.zip" . )
          ( cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256" )

      # Load-bearing, not a report: this is how the zip reaches the `release` job, which
      # downloads every `package-*` artifact and attaches it to the GitHub Release. On a manual
      # `workflow_dispatch` run no release is created, so the artifact is also the only way to
      # take delivery of the build. Kept short at three days either way.
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  # A small framework-dependent build for anyone who already has the .NET runtime and would
  # rather download 30 KB than 50 MB.
  publish-portable:
    name: publish (portable)
    needs: [version, verify]
    # See publish-standalone: `!cancelled()` lets this run past a skipped `verify`.
    if: ${{ !cancelled() && needs.version.outputs.proceed == 'true' && needs.verify.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-portable-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-portable-
            ${{ runner.os }}-nuget-

      - name: Publish
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet publish src/TargetApiSimulator/TargetApiSimulator.csproj \
            --configuration Release \
            -p:UseAppHost=false \
            -p:DebugType=embedded \
            -p:Version="$VERSION" \
            -p:InformationalVersion="$VERSION+$GITHUB_SHA" \
            --output out/portable

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          NAME="TargetApiSimulator-$VERSION-portable"
          rm -f out/portable/web.config out/portable/TargetApiSimulator.staticwebassets.endpoints.json
          cp scripts/smoke-test.ps1 scripts/smoke-test.sh out/portable/
          chmod +x out/portable/smoke-test.sh
          mkdir -p dist
          ( cd out/portable && zip -r "$GITHUB_WORKSPACE/dist/$NAME.zip" . )
          ( cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256" )

      # See publish-standalone: the `release` job's only input, and the only output of a manual
      # dry run.
      - uses: actions/upload-artifact@v7
        with:
          name: package-portable
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  release:
    name: release
    needs: [version, publish-standalone, publish-portable]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # For the artifact cleanup at the end of this job. A job-level `permissions:` block replaces
      # the workflow-level one outright, so it has to be named here.
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      # Creates the tag at this commit as part of publishing, so VERSION.md stays the only
      # place a version is ever typed.
      - name: Tag and publish the release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256

      # The artifacts were only the transport between the publish jobs and this one. The release
      # assets now hold the same bytes, so leaving them behind keeps a second copy of every zip -
      # 150 MB or so - in Actions storage with no reader until it expires. Deleting them here and
      # not earlier is what keeps a `workflow_dispatch` dry run working: this job is skipped when
      # `should_release` is false, which is exactly the case where the artifact IS the output.
      #
      # `continue-on-error` on purpose: the release is already published by this point, and a
      # failed cleanup must not turn a successful release red.
      - name: Delete the transport artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("package-")) | .id' \
          | while read -r id; do
              echo "Deleting artifact $id"
              gh api --method DELETE "repos/$REPO/actions/artifacts/$id" || true
            done

  docker:
    name: docker
    needs: [version, verify]
    # `!cancelled()` for the same reason as publish-standalone. Without it a skipped `verify`
    # would skip this job, and a release would ship zips but no image.
    if: ${{ !cancelled() && needs.version.outputs.should_release == 'true' && needs.verify.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Docker Hub is optional. GHCR needs no configuration, so a missing Docker Hub secret
      # must not fail a release that otherwise succeeded.
      - name: Log in to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME:-}" || -z "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; publishing to GHCR only." >&2
            echo "DOCKERHUB_ENABLED=false" >> "$GITHUB_ENV"
            {
              echo "### Docker Hub"
              echo ""
              echo "Skipped — \`DOCKERHUB_USERNAME\` / \`DOCKERHUB_TOKEN\` are not configured."
              echo "The image was published to GHCR only."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          echo "DOCKERHUB_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build and push
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR_MINOR="${VERSION%.*}"

          TAGS=(-t "$IMAGE_GHCR:$VERSION" -t "$IMAGE_GHCR:$MAJOR_MINOR" -t "$IMAGE_GHCR:latest")
          if [[ "${DOCKERHUB_ENABLED:-false}" == "true" ]]; then
            TAGS+=(-t "$IMAGE_DOCKERHUB:$VERSION" -t "$IMAGE_DOCKERHUB:$MAJOR_MINOR" -t "$IMAGE_DOCKERHUB:latest")
          fi

          docker build --build-arg VERSION="$VERSION" "${TAGS[@]}" .

          docker push --all-tags "$IMAGE_GHCR"
          if [[ "${DOCKERHUB_ENABLED:-false}" == "true" ]]; then
            docker push --all-tags "$IMAGE_DOCKERHUB"
          fi
