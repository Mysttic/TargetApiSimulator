version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    target-branch: develop
    open-pull-requests-limit: 5
    labels: [dependencies, nuget]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      microsoft:
        patterns:
          - 'Microsoft.*'
          - 'System.*'
      test:
        patterns:
          - 'xunit*'
          - 'coverlet*'
          - 'Shouldly'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    target-branch: develop
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
